<!doctype html>
<meta charset="utf-8">
<title>Outliner tests</title>
<style>body{font:14px system-ui;margin:16px} .ok{color:#2a8} .fail{color:#c33;font-weight:bold}</style>
<h1>Outliner tests</h1>
<pre id="out"></pre>
<script type="module">
import { keyBetween, Outline, ROOT, sameNodes } from '../js/model.js';
import { merge } from '../js/merge.js';
import { format } from '../js/format.js';
import { exportOPML, parseOPML, insertItems } from '../js/opml.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
function test(name, fn) {
  try { fn(); pass++; out.innerHTML += `<span class="ok">✓ ${name}</span>\n`; }
  catch (e) { fail++; out.innerHTML += `<span class="fail">✗ ${name}: ${e.message}</span>\n`; console.error(e); }
}
const eq = (a, b, msg = '') => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg} expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); };
const ok = (c, msg) => { if (!c) throw new Error(msg || 'assertion failed'); };
const texts = (o, pid = ROOT) => o.children(pid).map((n) => n.t);
const clone = (x) => structuredClone(x);
const tree = (o, pid = ROOT) => o.children(pid).map((n) => (o.hasChildren(n.id) ? [n.t, tree(o, n.id)] : n.t));

test('keyBetween orders correctly', () => {
  let keys = [keyBetween(null, null)];
  for (let i = 0; i < 200; i++) keys.push(keyBetween(keys[keys.length - 1], null));
  for (let i = 0; i < 200; i++) keys.unshift(keyBetween(null, keys[0]));
  for (let i = 0; i < 200; i++) keys.splice(201, 0, keyBetween(keys[200], keys[201]));
  for (let i = 1; i < keys.length; i++) ok(keys[i - 1] < keys[i], `${keys[i - 1]} < ${keys[i]} at ${i}`);
  ok(keys.every((k) => !k.endsWith('0')), 'no trailing zero');
});

test('insert / move / indent', () => {
  const o = new Outline();
  const a = o.insert(ROOT, null, { t: 'a' });
  const c = o.insert(ROOT, a.id, { t: 'c' });
  const b = o.insert(ROOT, a.id, { t: 'b' });
  eq(texts(o), ['a', 'b', 'c']);
  o.move(c.id, a.id, null);
  eq(tree(o), [['a', ['c']], 'b']);
  ok(!o.move(a.id, c.id, null), 'cannot move into own descendant');
  o.move(b.id, ROOT, null);
  eq(tree(o), ['b', ['a', ['c']]]);
});

function setup() {
  const o = new Outline();
  const a = o.insert(ROOT, null, { t: 'a' });
  const b = o.insert(ROOT, a.id, { t: 'b' });
  const c = o.insert(ROOT, b.id, { t: 'c' });
  return { base: clone(o.nodes), a: a.id, b: b.id, c: c.id };
}

test('merge: independent edits on both sides', () => {
  const s = setup();
  const L = new Outline(clone(s.base)), R = new Outline(clone(s.base));
  L.update(s.a, { t: 'A local' });
  R.update(s.c, { t: 'C remote' });
  R.insert(ROOT, s.c, { t: 'd' });
  const m = new Outline(merge(s.base, L.nodes, R.nodes));
  eq(texts(m), ['A local', 'b', 'C remote', 'd']);
});

test('merge: same text edited both sides keeps both', () => {
  const s = setup();
  const L = new Outline(clone(s.base)), R = new Outline(clone(s.base));
  L.update(s.b, { t: 'b-local' });
  R.update(s.b, { t: 'b-remote' });
  R.nodes[s.b].m += 1000; // remote newer
  const m = new Outline(merge(s.base, L.nodes, R.nodes));
  eq(texts(m), ['a', 'b-remote', 'b-local (conflict)', 'c']);
  // The other device merging the result again must not duplicate the conflict.
  for (const other of [R, L]) {
    const m2 = new Outline(merge(s.base, other.nodes, m.nodes));
    eq(texts(m2), ['a', 'b-remote', 'b-local (conflict)', 'c']);
  }
});

test('merge: done on one side, text on the other', () => {
  const s = setup();
  const L = new Outline(clone(s.base)), R = new Outline(clone(s.base));
  L.update(s.b, { d: true });
  R.update(s.b, { t: 'B' });
  const m = merge(s.base, L.nodes, R.nodes);
  eq([m[s.b].t, m[s.b].d], ['B', true]);
});

test('merge: color on one side, text on the other', () => {
  const s = setup();
  const L = new Outline(clone(s.base)), R = new Outline(clone(s.base));
  L.update(s.b, { cl: 3 });
  R.update(s.b, { t: 'B' });
  const m = merge(s.base, L.nodes, R.nodes);
  eq([m[s.b].t, m[s.b].cl], ['B', 3]);
});

test('merge: heading on one side, color on the other', () => {
  const s = setup();
  const L = new Outline(clone(s.base)), R = new Outline(clone(s.base));
  L.update(s.b, { h: 2 });
  R.update(s.b, { cl: 4 });
  const m = merge(s.base, L.nodes, R.nodes);
  eq([m[s.b].h, m[s.b].cl], [2, 4]);
});

test('missing color equals no color', () => {
  const s = setup();
  const R = new Outline(clone(s.base));
  R.nodes[s.a].cl = 0;
  ok(sameNodes(s.base, R.nodes));
  ok(sameNodes(merge(s.base, clone(s.base), R.nodes), s.base));
});

test('docOf finds the top-level document', () => {
  const o = new Outline();
  const d = o.insert(ROOT, null, { t: 'doc' });
  const a = o.insert(d.id, null, { t: 'a' });
  const b = o.insert(a.id, null, { t: 'b' });
  eq(o.docOf(b.id).id, d.id);
  eq(o.docOf(d.id).id, d.id);
  eq(o.docOf(ROOT), null);
});

test('folders: docOf / isDoc / allDocs', () => {
  const o = new Outline();
  const f1 = o.insert(ROOT, null, { t: 'F1', f: true });
  const f2 = o.insert(f1.id, null, { t: 'F2', f: true });
  const d1 = o.insert(f2.id, null, { t: 'D1' });
  const d0 = o.insert(ROOT, f1.id, { t: 'D0' });
  const a = o.insert(d1.id, null, { t: 'a' });
  const b = o.insert(a.id, null, { t: 'b' });
  eq(o.docOf(b.id).id, d1.id);
  eq(o.docOf(d1.id).id, d1.id);
  eq(o.docOf(f2.id), null);
  ok(o.isDoc(d1.id) && o.isDoc(d0.id) && !o.isDoc(f1.id) && !o.isDoc(a.id));
  eq(o.allDocs().map((d) => d.t), ['D1', 'D0']);
  ok(!o.move(f1.id, f2.id, null), 'folder cannot go into its own subfolder');
});

test('merge: folder flag survives, missing f equals false', () => {
  const s = setup();
  const L = new Outline(clone(s.base)), R = new Outline(clone(s.base));
  L.update(s.a, { f: true });
  R.update(s.a, { t: 'Folder A' });
  const m = merge(s.base, L.nodes, R.nodes);
  eq([m[s.a].t, m[s.a].f], ['Folder A', true]);
  const R2 = new Outline(clone(s.base));
  R2.nodes[s.b].f = false;
  ok(sameNodes(s.base, R2.nodes));
});

test('tables: row / cell detection and merge of tb', () => {
  const o = new Outline();
  const d = o.insert(ROOT, null, { t: 'doc' });
  const t = o.insert(d.id, null, { tb: true });
  const r = o.insert(t.id, null, {});
  const c = o.insert(r.id, null, { t: 'x' });
  ok(o.isTable(t.id) && o.isRow(r.id) && o.isCell(c.id));
  ok(!o.isCell(r.id) && !o.isRow(c.id) && !o.isTable(d.id));
  eq(o.docOf(c.id).id, d.id);
  const s = setup();
  const L = new Outline(clone(s.base)), R = new Outline(clone(s.base));
  L.update(s.c, { tb: true });
  R.update(s.c, { t: 'Table C' });
  const m = merge(s.base, L.nodes, R.nodes);
  eq([m[s.c].tb, m[s.c].t], [true, 'Table C']);
});

test('OPML round trip keeps tables, colors, headings, done', () => {
  const o = new Outline();
  const d = o.insert(ROOT, null, { t: 'Doc "one" & <two>' });
  const a = o.insert(d.id, null, { t: 'alpha', cl: 3, h: 2 });
  o.insert(a.id, null, { t: 'child', d: true });
  const t = o.insert(d.id, a.id, { t: 'My table', tb: true, hd: true, cw: '120,,80' });
  for (const row of [['h1', 'h2', 'h3'], ['x', '', 'z']]) {
    const r = o.insert(t.id, lastId(o, t.id), {});
    for (const v of row) o.insert(r.id, lastId(o, r.id), { t: v });
  }
  const xml = exportOPML(o, d.id);
  const { title, items } = parseOPML(xml);
  eq(title, 'Doc "one" & <two>');
  const o2 = new Outline();
  const d2 = o2.insert(ROOT, null, { t: title });
  eq(insertItems(o2, d2.id, items), 11); // alpha, child, table, 2 rows, 6 cells
  const [a2, t2] = o2.children(d2.id);
  eq([a2.t, a2.cl, a2.h], ['alpha', 3, 2]);
  eq(o2.children(a2.id)[0].d, true);
  eq([t2.t, t2.tb, t2.hd, t2.cw], ['My table', true, true, '120,,80']);
  eq(o2.children(t2.id).map((r) => o2.children(r.id).map((c) => c.t).join('|')), ['h1|h2|h3', 'x||z']);
  ok(o2.isCell(o2.children(o2.children(t2.id)[0].id)[0].id));
});

test('OPML import of Dynalist-style notes and colors', () => {
  const xml = `<?xml version="1.0"?><opml version="2.0"><head><title>DL</title></head><body>
    <outline text="task" complete="true" colorLabel="5" _note="line one&#10;line two"><outline text="sub"/></outline></body></opml>`;
  const { items } = parseOPML(xml);
  eq(items[0].fields, { t: 'task', d: true, cl: 5 });
  eq(items[0].children.map((c) => c.fields.t), ['line one', 'line two', 'sub']);
});

function lastId(o, pid) { const k = o.children(pid); return k.length ? k[k.length - 1].id : null; }

test('merge: delete vs untouched deletes', () => {
  const s = setup();
  const L = new Outline(clone(s.base)), R = new Outline(clone(s.base));
  L.remove(s.b);
  eq(texts(new Outline(merge(s.base, L.nodes, R.nodes))), ['a', 'c']);
});

test('merge: delete vs edit keeps edit', () => {
  const s = setup();
  const L = new Outline(clone(s.base)), R = new Outline(clone(s.base));
  L.remove(s.b);
  R.update(s.b, { t: 'b edited' });
  eq(texts(new Outline(merge(s.base, L.nodes, R.nodes))), ['a', 'b edited', 'c']);
});

test('merge: child added under remotely deleted parent resurrects parent', () => {
  const s = setup();
  const L = new Outline(clone(s.base)), R = new Outline(clone(s.base));
  L.insert(s.b, null, { t: 'child' });
  R.remove(s.b);
  const m = new Outline(merge(s.base, L.nodes, R.nodes));
  eq(tree(m), ['a', ['b', ['child']], 'c']);
});

test('merge: concurrent moves forming a cycle are broken', () => {
  const s = setup();
  const L = new Outline(clone(s.base)), R = new Outline(clone(s.base));
  L.move(s.a, s.b, null);
  R.move(s.b, s.a, null);
  const nodes = merge(s.base, L.nodes, R.nodes);
  const m = new Outline(nodes);
  // every node must be reachable from root
  const seen = new Set();
  const walk = (id) => { for (const k of m.children(id)) { seen.add(k.id); walk(k.id); } };
  walk(ROOT);
  eq(seen.size, 3, 'all reachable');
});

test('merge: concurrent inserts at same spot both kept, stable order', () => {
  const s = setup();
  const L = new Outline(clone(s.base)), R = new Outline(clone(s.base));
  L.insert(ROOT, s.a, { t: 'x' });
  R.insert(ROOT, s.a, { t: 'y' });
  const m1 = new Outline(merge(s.base, L.nodes, R.nodes));
  const m2 = new Outline(merge(s.base, R.nodes, L.nodes));
  eq(texts(m1), texts(m2));
  eq(texts(m1).length, 5);
  // and we can still insert between them
  const [, x] = m1.children(ROOT);
  m1.insert(ROOT, x.id, { t: 'z' });
  eq(texts(m1).length, 6);
});

test('merge: no base (first connect) unions both', () => {
  const L = new Outline(); L.insert(ROOT, null, { t: 'local' });
  const R = new Outline(); R.insert(ROOT, null, { t: 'remote' });
  const m = new Outline(merge(null, L.nodes, R.nodes));
  eq(texts(m).sort(), ['local', 'remote']);
});

test('merge is a no-op when nothing changed', () => {
  const s = setup();
  ok(sameNodes(merge(s.base, clone(s.base), clone(s.base)), s.base));
});

test('restore bumps m only on changed nodes', () => {
  const s = setup();
  const o = new Outline(clone(s.base));
  const before = o.snapshot();
  o.update(s.a, { t: 'changed' });
  const mB = o.nodes[s.b].m;
  o.restore(before);
  eq(o.nodes[s.a].t, 'a');
  eq(o.nodes[s.b].m, mB);
});

test('format keeps raw text as textContent', () => {
  for (const t of ['plain', '**bold** and __it__ `c<o>de`', 'see https://example.com/a?b=1&c=2.', 'snake_case and *stars*', '<script>x<\/script>', '']) {
    const div = document.createElement('div');
    div.innerHTML = format(t);
    eq(div.textContent, t, `for ${t}`);
  }
  const d = document.createElement('div');
  d.innerHTML = format('go to https://example.com/x.');
  eq(d.querySelector('.link').dataset.href, 'https://example.com/x');
  for (const t of ['see [the docs](https://example.com/x?a=1) now', '[bare](example.com)', '[a](b) and [c](d)']) {
    d.innerHTML = format(t);
    eq(d.textContent, t, `link text for ${t}`);
  }
  d.innerHTML = format('see [the docs](https://example.com/x?a=1) now');
  eq([d.querySelector('.link').textContent, d.querySelector('.link').dataset.href], ['the docs', 'https://example.com/x?a=1']);
  d.innerHTML = format('[bare](example.com)');
  eq(d.querySelector('.link').dataset.href, 'https://example.com');
  for (const t of ['~~gone~~ and ==hi==', '![cat](https://x.io/c.jpg) ok', '!https://x.io/c.png', '![](a.png)']) {
    d.innerHTML = format(t);
    eq(d.textContent, t, `text for ${t}`);
  }
  d.innerHTML = format('~~gone~~ and ==hi==');
  eq([d.querySelector('s').textContent, d.querySelector('mark').textContent], ['gone', 'hi']);
  d.innerHTML = format('![cat](https://x.io/c.jpg) ok');
  eq([d.querySelector('.img').textContent, d.querySelector('.img').dataset.href], ['cat', 'https://x.io/c.jpg']);
  d.innerHTML = format('!https://x.io/c.png');
  eq(d.querySelector('.img').dataset.href, 'https://x.io/c.png');
  d.innerHTML = format('a __b__ *c*');
  eq(d.querySelector('i').textContent, 'b');
  eq(d.querySelectorAll('i, b').length, 1, 'single * is plain text');
});

out.innerHTML += `\n${pass} passed, ${fail} failed\n`;
document.title = fail ? `FAIL ${fail}` : `PASS ${pass}`;
</script>
